<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Paradise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#0d0826;--panel:#180f3f;--line:#3d2f8a;--text:#f6f1ff;--muted:#b7a9e6;--sun:#f4ff1a;--neon:#f4ff1a;--teal:#f4ff1a;--coral:#ff5d73;--ok:#f4ff1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0}
header{padding:12px 16px 0;text-align:center}header img{width:100%;max-width:300px;height:auto;border-radius:16px;border:2px solid var(--line)}
header h1{font-size:24px;color:var(--sun);letter-spacing:.5px}
header small{color:var(--muted)}
nav{display:flex;gap:6px;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 6px;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:10px;font:800 14px Nunito,sans-serif;cursor:pointer}
nav button{border-color:var(--neon);color:var(--neon)}nav button.on{background:var(--neon);color:#0d0826;border-color:var(--neon);box-shadow:0 0 14px rgba(244,255,26,.55)}
main{padding:8px 16px 40px;max-width:980px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
.card h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.tag{font:800 11px Nunito;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--text)}.free .tag{background:var(--neon);color:#0d0826}
.free{border-color:var(--ok)}.busy{border-color:var(--sun)}
.up{border-color:var(--coral);animation:blink 1s infinite}
@keyframes blink{50%{background:#5a1f40}}
@media (prefers-reduced-motion:reduce){.up{animation:none}}
.time{font:400 34px Bungee,monospace;margin:8px 0 2px}
.muted{color:var(--muted);font-size:13px}
input,select{width:100%;padding:9px;margin:4px 0;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:700 14px Nunito}
button.b{width:100%;padding:10px;margin-top:6px;border:0;border-radius:10px;font:800 14px Nunito;cursor:pointer;background:var(--neon);color:#0d0826;box-shadow:0 0 10px rgba(244,255,26,.4)}
button.b.alt{background:var(--neon);color:#0d0826}button.b.red{background:var(--coral);color:#fff;box-shadow:none}
.row{display:flex;gap:6px}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:400 26px Bungee;color:var(--sun)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0}
.slot{padding:10px 4px;text-align:center;border-radius:10px;border:2px solid var(--neon);background:transparent;color:var(--neon);font:800 13px Nunito;cursor:pointer}
.slot.sel{background:var(--neon);color:#0d0826;box-shadow:0 0 12px rgba(244,255,26,.6)}
.slot:disabled{border-color:var(--line);color:var(--muted);opacity:.4;text-decoration:line-through;cursor:not-allowed}
.hide{display:none}.paused{border-color:#7aa7ff}a.b.wa{display:block;text-align:center;text-decoration:none;padding:12px;margin-top:8px;border-radius:10px;font:800 15px Nunito;background:var(--neon);color:#0d0826}.bill{margin:6px 0;font-size:16px;color:var(--sun)}td input{margin:0;min-width:64px}
.note{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:10px;margin:10px 0;font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<header><img alt="Pixel Paradise PlayStation Arena" src="logo.jpg"></header>
<nav id="nav"></nav>
<main>
<div id="cfg" class="note hide">Add your Supabase URL and key at the top of the script in index.html.</div>
<section id="staff" class="hide"></section>
<section id="owner" class="hide"></section>
<section id="book" class="hide"></section>
<section id="login" class="hide"></section>
</main>
<script>
/* ====== PASTE YOUR SUPABASE DETAILS HERE ====== */
const SUPABASE_URL='https://qintmobzotccczrmqwgh.supabase.co';
const SUPABASE_KEY='PASTE_YOUR_ANON_PUBLIC_KEY';
const WA='919629668242';
const PEOPLE=[['talha','Talha (Owner)'],['taha','Taha (Owner)'],['saiyan','Saiyan (Staff)'],['aamir','Aamir (Staff)'],['staff','Staff (Staff)']];
const LOGIN_DOMAIN='@pixelparadise.app'; // hidden, do not change after creating users
/* ============================================== */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const stations=[];
for(let i=1;i<=5;i++)stations.push({id:'Screen '+i,type:'Screen'});
stations.push({id:'Car Simulator',type:'Car Simulator'});
stations.push({id:'Meta Quest VR',type:'Meta Quest VR'});
const MODES={single:'1 player',multi2:'2 players',multi4:'3 to 4 players',car:'Car Simulator',vr:'Meta Quest VR'};
let P={single:{30:70,60:120},multi2:{30:100,60:180},multi4:{30:180,60:340},car:{30:120,60:220},vr:{30:140,60:230}};
let sessions=[],bookings=[],role=null,OD='';
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString('en-CA');
OD=today();
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(c).padStart(2,'0')};
const hm=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const stT=a=>Date.parse(a.start_at),enT=a=>Date.parse(a.end_at);
const active=id=>sessions.find(s=>s.station===id&&!s.ended_at);
const isPS=t=>t==='Screen';
const isCon=t=>t==='PS4'||t==='PS5';
const modeOf=(type,pl)=>type==='Car Simulator'?'car':type==='Meta Quest VR'?'vr':(pl||'single');
const cost=(mode,min)=>Math.floor(min/60)*P[mode][60]+(min%60>=30?P[mode][30]:0);
const durLabel=m=>m>=60?(m/60)+(m===60?' hour':' hours'):m+' min';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let beeped={};
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}}

/* ---------- data ---------- */
async function loadPrices(){const {data}=await sb.from('prices').select('*');if(data)data.forEach(r=>{P[r.mode]={30:r.p30,60:r.p60}})}
async function loadSessions(){
  const from=new Date(Date.now()-62*864e5).toLocaleDateString('en-CA');
  const {data}=await sb.from('sessions').select('*').gte('day',from).order('id');
  if(data)sessions=data;
}
async function loadBookings(){
  const {data}=await sb.from('bookings').select('*').order('id',{ascending:false}).limit(100);
  if(data)bookings=data;
}
async function refresh(force){
  if(!role)return;
  await loadSessions();
  const f=document.activeElement;
  if(force||!f||!['INPUT','SELECT'].includes(f.tagName)){renderStaff();if(role==='owner')renderOwner()}
}

/* ---------- staff ---------- */
function renderStaff(){
  $('staff').innerHTML='<div class="grid">'+stations.map(st=>{
    const a=active(st.id);
    if(!a)return `<div class="card free"><h3>${st.id}<span class="tag">Free</span></h3>
      <input id="n_${st.id}" placeholder="Customer name">
      ${isPS(st.type)?`<select id="c_${st.id}"><option>PS4</option><option>PS5</option></select>`:''}
      ${isPS(st.type)?`<select id="p_${st.id}" onchange="calc('${st.id}')"><option value="single">1 player</option><option value="multi2">2 players</option><option value="multi4">3 to 4 players</option></select>`:''}
      <select id="d_${st.id}" onchange="calc('${st.id}')"><option value="30">30 min</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option></select>
      <div class="muted">Amount: <b id="a_${st.id}"></b></div>
      <button class="b" onclick="startS('${st.id}')">Start session</button></div>`;
    const m=a.mode;
    return `<div class="card busy" id="c_${st.id}"><h3>${st.id}<span class="tag" id="t_${st.id}">Playing</span></h3>
      <div class="time" id="r_${st.id}">--</div>
      <div class="muted"><b>${esc(a.name)}</b> · ${isCon(a.type)?a.type+' · ':''}${MODES[m]}<br>In ${hm(stT(a))} · ${a.paused_at?'Stopped at '+hm(Date.parse(a.paused_at)):'Out '+hm(enT(a))}<br>Played ${durLabel(a.minutes)}</div>
      <div class="bill">Bill: <b>${money(a.amount)}</b></div>
      <button class="b alt" onclick="${a.paused_at?'resume':'pause'}('${st.id}')">${a.paused_at?'▶ Resume time':'⏸ Stop time (power cut)'}</button>
      <div class="muted">Extend ${esc(a.name)}:</div>
      <div class="row"><button class="b alt" onclick="extend('${st.id}',30)">+30 min<br>${money(cost(m,30))}</button><button class="b alt" onclick="extend('${st.id}',60)">+1 hour<br>${money(cost(m,60))}</button></div>
      <button class="b red" onclick="endS('${st.id}')">End and collect ${money(a.amount)}</button></div>`}).join('')+'</div>';
  stations.forEach(st=>{if(!active(st.id))calc(st.id)});
  tick();
}
function calc(id){
  const type=stations.find(s=>s.id===id).type;const p=$('p_'+id);
  $('a_'+id).textContent=money(cost(modeOf(type,p&&p.value),+$('d_'+id).value));
}
async function startS(id){
  const name=$('n_'+id).value.trim()||'Walk-in';const min=+$('d_'+id).value;
  const st=stations.find(s=>s.id===id);const c=$('c_'+id);const type=c?c.value:st.type;
  const p=$('p_'+id);const mode=modeOf(type,p&&p.value);const now=Date.now();
  const {error}=await sb.from('sessions').insert({station:id,type,mode,name,start_at:new Date(now).toISOString(),end_at:new Date(now+min*60000).toISOString(),minutes:min,amount:cost(mode,min),ext:[],day:today()});
  if(error){alert('Could not save: '+error.message);return}
  await refresh(true);
}
async function extend(id,min){
  const a=active(id);const add=cost(a.mode,min);
  const end=(a.paused_at?enT(a):Math.max(enT(a),Date.now()))+min*60000;
  const {error}=await sb.from('sessions').update({end_at:new Date(end).toISOString(),minutes:a.minutes+min,amount:Number(a.amount)+add,ext:[...(a.ext||[]),{min,add}]}).eq('id',a.id);
  if(error){alert('Could not save: '+error.message);return}
  delete beeped[id];await refresh(true);
}
async function pause(id){
  const a=active(id);
  const {error}=await sb.from('sessions').update({paused_at:new Date().toISOString()}).eq('id',a.id);
  if(error){alert('Could not save: '+error.message);return}
  await refresh(true);
}
async function resume(id){
  const a=active(id);const gap=Date.now()-Date.parse(a.paused_at);
  const {error}=await sb.from('sessions').update({end_at:new Date(enT(a)+gap).toISOString(),paused_at:null}).eq('id',a.id);
  if(error){alert('Could not save: '+error.message);return}
  delete beeped[id];await refresh(true);
}
async function endS(id){
  const a=active(id);
  const {error}=await sb.from('sessions').update({ended_at:new Date().toISOString()}).eq('id',a.id);
  if(error){alert('Could not save: '+error.message);return}
  await refresh(true);
}
function tick(){
  stations.forEach(st=>{
    const a=active(st.id);if(!a)return;
    const left=enT(a)-(a.paused_at?Date.parse(a.paused_at):Date.now());const r=$('r_'+st.id),c=$('c_'+st.id),t=$('t_'+st.id);
    if(!r)return;
    if(a.paused_at){r.textContent=fmt(left);c.className='card paused';t.textContent='Paused';return}
    if(left<=0){r.textContent='TIME UP';c.className='card up';t.textContent='Time up';if(!beeped[st.id]){beeped[st.id]=1;beep()}}
    else{r.textContent=fmt(left);c.className='card busy';t.textContent='Playing'}
  });
}
setInterval(tick,1000);
setInterval(()=>{if(role)refresh()},20000);

/* ---------- owner ---------- */
async function renderOwner(){
  await loadBookings();
  const d=sessions.filter(s=>s.day===OD);
  const sum=l=>l.reduce((a,s)=>a+Number(s.amount),0);
  const by=t=>sum(d.filter(s=>s.type===t));
  const mon=sum(sessions.filter(s=>s.day.slice(0,7)===OD.slice(0,7)));
  const busy=stations.filter(s=>active(s.id)).length;
  $('owner').innerHTML=`<div class="card" style="margin-bottom:12px"><span class="muted">Date</span><input type="date" value="${OD}" onchange="OD=this.value||today();renderOwner()"></div>
    <div class="stats">
    <div class="stat"><span class="muted">Earnings on this date</span><b>${money(sum(d))}</b></div>
    <div class="stat"><span class="muted">This month</span><b>${money(mon)}</b></div>
    <div class="stat"><span class="muted">Sessions</span><b>${d.length}</b></div>
    <div class="stat"><span class="muted">In use now</span><b>${busy}/${stations.length}</b></div></div>
    <div class="card" style="margin-bottom:12px"><h3>Earnings by game</h3>
    <p>${['PS4','PS5','Car Simulator','Meta Quest VR'].map(t=>`${t}: <b>${money(by(t))}</b>`).join(' &nbsp; ')}</p></div>
    <div class="card" style="margin-bottom:12px"><h3>Prices (₹)</h3><div class="wrap"><table><tr><th>Game</th><th>30 min</th><th>1 hour</th></tr>
    ${Object.keys(MODES).map(k=>`<tr><td>${k==='single'?'PS4 / PS5, 1 player':MODES[k]}</td>${[30,60].map(t=>`<td><input type="number" min="0" value="${P[k][t]}" onchange="savePrice('${k}',${t},this.value)"></td>`).join('')}</tr>`).join('')}</table></div></div>
    <div class="card" style="margin-bottom:12px"><h3>Sessions</h3><div class="wrap"><table><tr><th>Station</th><th>Customer</th><th>In</th><th>Out</th><th>Amount</th></tr>
    ${d.slice().reverse().map(s=>`<tr><td>${s.station}${isCon(s.type)?' · '+s.type:''}</td><td>${esc(s.name)}${s.ext&&s.ext.length?' <span class="muted">(extended '+s.ext.length+'x)</span>':''}</td><td>${hm(stT(s))}</td><td>${hm(s.ended_at||s.end_at)}</td><td>${money(s.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No sessions on this date.</td></tr>'}</table></div></div>
    <div class="card"><h3>Online bookings</h3><div class="wrap"><table><tr><th>Date</th><th>Time</th><th>Game</th><th>Customer</th><th>Status</th></tr>
    ${bookings.map(b=>`<tr><td>${b.date}</td><td>${b.slot}:00</td><td>${b.type}${isCon(b.type)&&b.players&&b.players!=='single'?' ('+MODES[b.players]+')':''}</td><td>${esc(b.name)}<br><span class="muted">${esc(b.phone)}</span></td><td>${b.status}<br>${b.status==='pending'?`<button class="slot" onclick="setStatus(${b.id},'confirmed')">Confirm</button> `:''}${b.status!=='cancelled'?`<button class="slot" onclick="setStatus(${b.id},'cancelled')">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No bookings yet.</td></tr>'}</table></div></div>`;
}
async function savePrice(k,t,v){
  P[k][t]=+v;
  const {error}=await sb.from('prices').update(t===30?{p30:+v}:{p60:+v}).eq('mode',k);
  if(error)alert('Could not save price: '+error.message);
}
async function setStatus(id,st){await sb.from('bookings').update({status:st}).eq('id',id);renderOwner()}

/* ---------- customer booking ---------- */
let B={type:'PS5',pl:'single',date:today(),slot:null},TK=[];
const grp=t=>isCon(t)?'PS':t;
async function renderBook(){
  const {data}=await sb.rpc('get_taken_slots',{d:B.date});TK=data||[];drawBook();
}
function drawBook(){
  const cap=grp(B.type)==='PS'?5:1;
  const slots=[];for(let h=10;h<=23;h++)slots.push(h);
  const taken=h=>((TK.find(r=>r.grp===grp(B.type)&&r.slot===h)||{}).n||0)>=cap;
  const m=modeOf(B.type,B.pl);
  $('book').innerHTML=`<div class="card"><h2 style="font-size:20px;margin-bottom:8px">Book your game</h2>
    <label class="muted">Game</label><select onchange="B.type=this.value;B.slot=null;drawBook()">
    ${['PS4','PS5','Car Simulator','Meta Quest VR'].map(t=>`<option ${t===B.type?'selected':''}>${t}</option>`).join('')}</select>
    ${isCon(B.type)?`<label class="muted">Players</label><select onchange="B.pl=this.value;drawBook()">${['single','multi2','multi4'].map(k=>`<option value="${k}" ${B.pl===k?'selected':''}>${MODES[k]}</option>`).join('')}</select>`:''}
    <div class="muted">Price: ${money(P[m][30])} for 30 min · ${money(P[m][60])} for 1 hour</div>
    <label class="muted">Date</label><input type="date" min="${today()}" value="${B.date}" onchange="B.date=this.value||today();B.slot=null;renderBook()">
    <label class="muted">Pick a one-hour slot</label>
    <div class="slots">${slots.map(h=>`<button class="slot ${B.slot===h?'sel':''}" ${taken(h)?'disabled':''} onclick="B.slot=${h};drawBook()">${h>12?h-12:h}${h>=12?' PM':' AM'}</button>`).join('')}</div>
    <input id="bn" maxlength="60" placeholder="Your name"><input id="bp" maxlength="20" type="tel" placeholder="Phone number">
    <button class="b" onclick="confirmB()">Confirm booking</button><div id="bm" class="muted" style="margin-top:8px"></div></div>`;
}
async function confirmB(){
  const name=$('bn').value.trim(),phone=$('bp').value.trim();
  if(B.slot===null||!name||!phone){$('bm').textContent='Pick a slot and enter your name and phone number.';return}
  const {error}=await sb.from('bookings').insert({date:B.date,slot:B.slot,type:B.type,players:B.pl,name,phone});
  if(error){$('bm').textContent='Could not book. Please try again or call us.';return}
  const m=modeOf(B.type,B.pl);
  const slot=(B.slot>12?B.slot-12:B.slot)+(B.slot>=12?' PM':' AM');
  const msg=`Hello Pixel Paradise, I want to book:\nName: ${name}\nPhone: ${phone}\nGame: ${B.type}${isCon(B.type)?' ('+MODES[B.pl]+')':''}\nDate: ${B.date}\nTime: ${slot}\nPrice: ${money(P[m][60])} per hour\nPlease confirm.`;
  const url='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  $('bm').innerHTML=`Booking received! Tap below to send it on WhatsApp for confirmation.<a class="b wa" href="${url}" target="_blank" rel="noopener">Send on WhatsApp</a>`;
  try{window.open(url,'_blank')}catch(e){}
}

/* ---------- login ---------- */
const LBL={staff:'Staff',owner:'Owner',book:'Book a slot',login:'Staff / Owner login'};
function renderNav(v){
  const tabs=role?(role==='owner'?['staff','owner','book']:['staff','book']):['book','login'];
  $('nav').innerHTML=tabs.map(t=>`<button class="${t===v?'on':''}" onclick="show('${t}')">${LBL[t]}</button>`).join('')+(role?'<button onclick="logout()">Logout</button>':'');
}
function show(v){
  if((v==='staff'&&!role)||(v==='owner'&&role!=='owner'))v='login';
  if(v==='login'&&role)v='staff';
  ['staff','owner','book','login'].forEach(x=>$(x).classList.toggle('hide',x!==v));
  if(v==='owner')renderOwner();
  if(v==='login')renderLogin();
  if(v==='book')renderBook();
  renderNav(v);
}
function renderLogin(){
  $('login').innerHTML=`<div class="card"><h2 style="font-size:20px;margin-bottom:8px">Staff / Owner login</h2>
  <select id="le"><option value="">Select your name</option>${PEOPLE.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('')}</select>
  <input id="lp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit passcode" autocomplete="off" oninput="this.value=this.value.replace(/\D/g,'')" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="b" onclick="doLogin()">Login</button><div id="lm" class="muted" style="margin-top:8px"></div></div>`;
}
async function setRole(){
  const {data}=await sb.rpc('my_role');role=data||null;
  if(!role)await sb.auth.signOut();
  return role;
}
async function doLogin(){
  const name=$('le').value,code=$('lp').value;
  if(!name||code.length!==6){$('lm').textContent='Select your name and enter your 6 digit passcode.';return}
  const {error}=await sb.auth.signInWithPassword({email:name+LOGIN_DOMAIN,password:code});
  if(error){$('lm').textContent='Wrong name or passcode.';return}
  if(!await setRole()){$('lm').textContent='This login does not have access.';return}
  await loadPrices();await loadSessions();renderStaff();listen();show('staff');
}
function listen(){sb.channel('sess').on('postgres_changes',{event:'*',schema:'public',table:'sessions'},()=>refresh()).subscribe()}
async function logout(){await sb.removeAllChannels();await sb.auth.signOut();role=null;sessions=[];show('book')}
(async function init(){
  if(SUPABASE_URL.startsWith('PASTE')){$('cfg').classList.remove('hide')}
  try{
    await loadPrices();
    const {data}=await sb.auth.getSession();
    if(data.session&&await setRole()){await loadSessions();renderStaff();listen();show('staff');return}
  }catch(e){}
  show('book');
})();
</script>
