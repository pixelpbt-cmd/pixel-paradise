<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Paradise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#0d0826;--panel:#180f3f;--line:#3d2f8a;--text:#f6f1ff;--muted:#b7a9e6;--sun:#f4ff1a;--neon:#f4ff1a;--teal:#f4ff1a;--coral:#ff5d73;--ok:#f4ff1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0}
header{padding:12px 16px 0;text-align:center}header img{width:100%;max-width:240px;height:auto;border-radius:50%;cursor:pointer}
header h1{font-size:24px;color:var(--sun);letter-spacing:.5px}
header small{color:var(--muted)}
nav{display:flex;gap:6px;padding:8px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 6px;border:2px solid var(--line);background:transparent;color:var(--text);border-radius:10px;font:800 14px Nunito,sans-serif;cursor:pointer}
nav button{border-color:var(--neon);color:var(--neon)}nav button.on{background:var(--neon);color:#0d0826;border-color:var(--neon);box-shadow:0 0 14px rgba(244,255,26,.55)}
main{padding:8px 16px 40px;max-width:980px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
.card h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.tag{font:800 11px Nunito;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--text)}.free .tag{background:var(--neon);color:#0d0826}
.free{border-color:var(--ok)}.busy{border-color:var(--sun)}
.up{border-color:var(--coral);animation:blink 1s infinite}
@keyframes blink{50%{background:#5a1f40}}
@media (prefers-reduced-motion:reduce){.up{animation:none}}
.time{font:400 34px Bungee,monospace;margin:8px 0 2px}
.muted{color:var(--muted);font-size:13px}
input,select{width:100%;padding:9px;margin:4px 0;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:700 14px Nunito}
button.b{width:100%;padding:10px;margin-top:6px;border:0;border-radius:10px;font:800 14px Nunito;cursor:pointer;background:var(--neon);color:#0d0826;box-shadow:0 0 10px rgba(244,255,26,.4)}
button.b.alt{background:var(--neon);color:#0d0826}button.b.red{background:var(--coral);color:#fff;box-shadow:none}
.row{display:flex;gap:6px}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:400 26px Bungee;color:var(--sun)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.wrap{overflow-x:auto}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0}
.slot{padding:10px 4px;text-align:center;border-radius:10px;border:2px solid var(--neon);background:transparent;color:var(--neon);font:800 13px Nunito;cursor:pointer}
.slot.sel{background:var(--neon);color:#0d0826;box-shadow:0 0 12px rgba(244,255,26,.6)}
.slot:disabled{border-color:var(--line);color:var(--muted);opacity:.4;text-decoration:line-through;cursor:not-allowed}
.hide{display:none}.stab{display:flex;gap:6px;margin-bottom:12px}.stab button{flex:1;padding:10px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:10px;font:800 14px Nunito,sans-serif;cursor:pointer}.stab button.on{background:var(--neon);color:#0d0826}.steps{list-style:none;margin:0;padding:0}.steps li{border-left:3px solid var(--neon);padding:6px 0 6px 12px;margin-bottom:10px;font-size:14px;line-height:1.5}.annc{text-align:center;border-color:var(--neon);box-shadow:0 0 18px rgba(244,255,26,.35);margin-bottom:12px}.annc h2{font-size:19px;color:var(--neon);margin-bottom:8px}.cd{display:flex;gap:8px;justify-content:center;margin:10px 0}.cb{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 6px;min-width:64px}.cb b{display:block;font:400 28px Bungee,monospace;color:var(--neon)}.cb span{font-size:11px;color:var(--muted)}.live{font:400 22px Bungee,sans-serif;color:var(--neon);padding:10px}.poster{margin-bottom:12px;padding:8px}.poster img,.pcard img{width:100%;height:auto;border-radius:10px;display:block}.pcard{margin:12px 0;padding:8px;border:2px solid var(--line);border-radius:12px}.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.subnav .slot{flex:1;min-width:104px}table input.rk,table th input[type=checkbox]{width:20px;height:20px;margin:0;padding:0}.ck{width:34px}.modal{position:fixed;inset:0;background:rgba(5,3,20,.85);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:16px}.modal.hide{display:none}.sheet{background:var(--panel);border:2px solid var(--line);border-radius:14px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:16px}.sheet h3{font-size:18px;margin-bottom:8px;color:var(--neon)}.sheet h4{margin:14px 0 4px;color:var(--neon)}.sheet p{font-size:14px;line-height:1.5;margin:0 0 6px}.sheet .x{position:sticky;top:0;float:right;background:var(--neon);color:#0d0826;border:0;border-radius:8px;padding:6px 12px;font:800 13px Nunito,sans-serif;cursor:pointer}.ll{font-size:11px;color:var(--muted);margin-bottom:12px;line-height:2}.ll a{color:var(--muted);text-decoration:underline;cursor:pointer;margin:0 6px}label.chk{display:block;font-size:13px;margin:8px 0;color:var(--muted)}label.chk input{width:auto;margin:0 8px 0 0}label.chk a{color:var(--neon);cursor:pointer;text-decoration:underline}footer{text-align:center;padding:20px 16px 32px}footer img{width:130px;height:auto;border-radius:12px}footer div{margin-top:8px;font:700 13px Nunito,sans-serif;color:var(--muted);letter-spacing:.5px}footer{text-align:center;padding:28px 16px 36px;color:var(--muted);font:700 13px Nunito,sans-serif}footer img{display:block;margin:0 auto 8px;width:110px;height:auto;opacity:.95}.top{text-align:left;margin-bottom:8px}#shopbtn{background:transparent;color:var(--neon);border:2px solid var(--neon);border-radius:10px;padding:7px 12px;font:800 13px Nunito,sans-serif;cursor:pointer}#nav:empty{display:none}button.b.ghost{background:transparent;color:var(--coral);border:2px solid var(--coral);box-shadow:none}button.b.ghost2{background:transparent;color:var(--neon);border:2px solid var(--neon);box-shadow:none}button.b.big{padding:22px;font-size:18px;margin-top:10px}.paused{border-color:#7aa7ff}a.b.wa{display:block;text-align:center;text-decoration:none;padding:12px;margin-top:8px;border-radius:10px;font:800 15px Nunito;background:var(--neon);color:#0d0826}.bill{margin:6px 0;font-size:16px;color:var(--sun)}td input{margin:0;min-width:64px}
.note{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:10px;margin:10px 0;font-size:13px;color:var(--muted)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="legal.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
/* GAMING LOOK */
:root{--cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
body{font-family:Rajdhani,sans-serif;font-weight:600;font-size:16px;background:radial-gradient(circle at 12% -5%,#3a1b8f 0,transparent 45%),radial-gradient(circle at 96% 8%,rgba(160,40,200,.35) 0,transparent 40%),#0a0820;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px)}
main,header,footer,nav{position:relative;z-index:1}
h1,h2,h3,.time,.stat b,button,.tag,.bill b,th{font-family:Orbitron,sans-serif!important;letter-spacing:.05em}
.card,.stat,button,.slot,input,select,.note,.sheet,.tag{border-radius:0!important;clip-path:var(--cut)}
.tag{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
:focus-visible{outline:3px solid #f4ff1a!important;outline-offset:-4px!important}
.card{background:linear-gradient(160deg,#1c1263,#120c3d);border:2px solid #3b2fa0}
.card.free{border-color:#2de2f5}.card.busy{border-color:#f4ff1a}.card.paused{border-color:#7aa7ff}
.card h3{font-size:14px}
.time{font-size:38px!important;color:#f4ff1a;text-shadow:0 0 14px rgba(244,255,26,.55)}
button.b{background:linear-gradient(180deg,#faff72,#f4ff1a);color:#0a0820;border:0;box-shadow:none;text-transform:uppercase;font-size:13px}
button.b.alt{background:linear-gradient(180deg,#7df0ff,#2de2f5);color:#0a0820}
button.b.red{background:linear-gradient(180deg,#ff7a92,#ff4d6d);color:#fff}
button.b.ghost,button.b.ghost2{background:#1d1659;color:#ff7a92;border:0}button.b.ghost2{color:#cfc8ff}
#nav button,.sub button,.stab button{background:#1d1659;color:#cfc8ff;border:0;box-shadow:none;text-transform:uppercase;font-size:12px;padding:12px 10px}
#nav button.on,.sub button.on,.stab button.on{background:#f4ff1a;color:#0a0820}
#shopbtn{background:#2de2f5;color:#0a0820;border:0;font-size:12px;padding:10px 14px;clip-path:var(--cut);border-radius:0}
.slot{background:#1d1659;color:#cfc8ff;border:0;box-shadow:none;font-size:12px;min-height:46px}
.slot.sel{background:#f4ff1a;color:#0a0820;box-shadow:none}
.slot:disabled{opacity:.35;text-decoration:none}
.gm .slot{min-height:64px;font-size:13px}
input,select{background:#0d0a33;border:2px solid #3b2fa0;color:#fff;font-family:Rajdhani,sans-serif;font-weight:700}
.stat{background:linear-gradient(160deg,#1c1263,#120c3d);border:2px solid #3b2fa0}
.stat b{font-size:24px;color:#f4ff1a}
.sheet{background:#150f45}
header img{filter:drop-shadow(0 0 18px rgba(130,70,255,.6))}
footer .cr{margin-top:6px;font:700 12px Rajdhani,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
footer .crl{width:170px;height:auto;border-radius:0;mix-blend-mode:screen;margin-top:0}
</style>
</head>
<body>
<header><div class="top"><button id="shopbtn" onclick="show('login')">🔒 Shop login</button></div><img alt="Pixel Paradise PlayStation Arena" src="logo.png" onclick="logoTap()"></header>
<nav id="nav"></nav>
<main>
<div id="cfg" class="note hide">Add your Supabase URL and key in config.js.</div>
<section id="ann" class="hide"></section>
<section id="staff" class="hide"></section>
<section id="owner" class="hide"></section>
<section id="book" class="hide"></section>
<section id="login" class="hide"></section>
</main>
<footer><div class="ll"><a onclick="showLegal('privacy')">Privacy Policy</a>·<a onclick="showLegal('terms')">Terms and Conditions</a>·<a onclick="showLegal('refund')">Cancellation and Refund</a>·<a onclick="showLegal('cookies')">Cookie Policy</a>·<a onclick="showLegal('contact')">Contact and Grievance</a></div><div class="cr">Created by</div><img class="crl" src="fexora.jpg" alt="Fexora Digital"></footer>
<div id="legal" class="modal hide" onclick="if(event.target===this)closeLegal()"><div class="sheet"><button class="x" onclick="closeLegal()">Close ✕</button><div id="lgBody"></div></div></div>

<script>
const WA='919629668242';
const LOGIN_DOMAIN='@pixelparadise.app'; // hidden, do not change after creating users
const OWNERS=[['talha','Talha'],['taha','Taha']];
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const stations=[];
for(let i=1;i<=6;i++)stations.push({id:'Screen '+i,type:'Screen'});
stations.push({id:'Car Simulator',type:'Car Simulator'});
stations.push({id:'Meta Quest VR',type:'Meta Quest VR'});
const MODES={single:'1 player',multi2:'2 players',multi3:'3 players',multi4:'4 players',car:'Car Simulator',vr:'Meta Quest VR'};
let P={single:{30:70,60:120},multi2:{30:100,60:180},multi3:{30:150,60:280},multi4:{30:280,60:360},car:{30:120,60:220},vr:{30:140,60:230}};
let sessions=[],bookings=[],role=null,shopCred=null,ownerCred=null,view='book',q='';
const $=id=>document.getElementById(id);
const today=()=>new Date().toLocaleDateString('en-CA');
let OD=today();
const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(c).padStart(2,'0')};
const hm=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const stT=a=>Date.parse(a.start_at),enT=a=>Date.parse(a.end_at);
const active=id=>sessions.find(s=>s.station===id&&!s.ended_at);
const isPS=t=>t==='Screen';
const isCon=t=>t==='PS4'||t==='PS5';
const modeOf=(type,pl)=>type==='Car Simulator'?'car':type==='Meta Quest VR'?'vr':(pl||'single');
const cost=(mode,min)=>Math.floor(min/60)*P[mode][60]+(min%60>=30?P[mode][30]:0);
const durLabel=m=>m>=60?(m/60)+(m===60?' hour':' hours'):m+' min';
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const errMsg=e=>/invalid login/i.test(e.message)?'Wrong ID or passcode.':'Error: '+e.message;
let beeped={};
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}}

/* ---------- data ---------- */
async function loadPrices(){const {data}=await sb.from('prices').select('*');if(data)data.forEach(r=>{P[r.mode]={30:r.p30,60:r.p60}})}
let loadedDays=0,loadedAt=0,spage='play',checkedAt=null;
async function loadSessions(days=3){
  const since=new Date(Date.now()-days*864e5).toLocaleDateString('en-CA');
  let all=[],from=0,ok=true;
  for(;;){
    const {data,error}=await sb.from('sessions').select('*').gte('day',since).order('id').range(from,from+999);
    if(error||!data){ok=false;break}
    all=all.concat(data);
    if(data.length<1000)break;
    from+=1000;
  }
  if(ok){sessions=all;loadedDays=days;loadedAt=Date.now();checkedAt=new Date()}
}
async function loadBookings(){
  const {data}=await sb.from('bookings').select('*').order('id',{ascending:false}).limit(200);
  if(data)bookings=data;
}
async function refresh(force){
  if(!role||view!=='shop')return;
  await loadSessions(3);
  const f=document.activeElement;
  if(force||!f||!['INPUT','SELECT'].includes(f.tagName))renderStaff();
}

/* ---------- shop panel ---------- */
const bk=s=>s.bill_id||s.id;
const held=()=>sessions.filter(s=>s.ended_at&&s.paid===false);
function openBills(){const m={};held().forEach(s=>{const k=bk(s);const b=m[k]=m[k]||{k,name:s.name,items:[],total:0};b.items.push(s);b.total+=Number(s.amount)});return Object.values(m)}
const heldFor=a=>a.bill_id?held().filter(s=>bk(s)===a.bill_id).reduce((t,s)=>t+Number(s.amount),0):0;
const itemsTxt=l=>l.map(s=>`${s.station}${isCon(s.type)?' ('+s.type+')':''} ${money(s.amount)}`).join(' + ');
function billSelect(id){
  const b=openBills();if(!b.length)return '';
  return `<select id="b_${id}"><option value="">New customer (type the name above)</option>${b.map(x=>`<option value="${x.k}">Continue ${esc(x.name)}'s bill (${money(x.total)} pending)</option>`).join('')}</select>`;
}
function billNote(a){
  const h=a.bill_id?held().filter(s=>bk(s)===a.bill_id):[];
  if(!h.length)return `<div class="bill">Bill: <b>${money(a.amount)}</b></div>`;
  const hs=h.reduce((t,s)=>t+Number(s.amount),0);
  return `<div class="bill">This game: <b>${money(a.amount)}</b></div><div class="muted">Earlier on this bill: ${itemsTxt(h)}</div><div class="bill">Total to collect: <b>${money(a.amount+hs)}</b></div>`;
}
function openBillsHtml(){
  const b=openBills();if(!b.length)return '';
  return `<div class="card" style="margin-bottom:12px"><h3>Open bills (not paid yet)</h3>`+b.map(x=>`<div class="muted" style="margin:10px 0 4px"><b>${esc(x.name)}</b> · ${itemsTxt(x.items)}<br>Total: <b>${money(x.total)}</b></div>
    <select id="ob_${x.k}"><option value="Cash">Pay by Cash</option><option value="UPI">Pay by UPI</option></select>
    <button class="b" onclick="settleBill(${x.k})">Collect ${money(x.total)}</button>`).join('')+`<div class="note">A customer who finished one game and may play another later is kept here. Start the next game with "Continue ... bill" to combine them, or collect the money here.</div></div>`;
}
async function settleBill(k){
  const ids=held().filter(s=>bk(s)===k).map(s=>s.id);
  const {error}=await sb.from('sessions').update({paid:true,pay_mode:$('ob_'+k).value}).in('id',ids);
  if(error){alert('Could not save: '+error.message);return}
  await refresh(true);
}
async function holdS(id){if(await upd(id,{ended_at:new Date().toISOString(),paused_at:null,status:'done',paid:false}))await refresh(true)}
const shopTabs=()=>`<div class="stab"><button class="${spage==='play'?'on':''}" onclick="spage='play';renderStaff()">Screens</button><button class="${spage==='today'?'on':''}" onclick="openToday()">Today's earnings</button></div>`;
async function openToday(){
  spage='today';
  $('staff').innerHTML=shopTabs()+'<div class="card"><div class="muted">Checking the database...</div></div>';
  await loadSessions(3);renderStaff();
}
function todayHtml(){
  const d=sessions.filter(s=>s.day===today()).sort((a,b)=>a.id-b.id);
  const sum=m=>d.filter(s=>!m||s.pay_mode===m).reduce((a,s)=>a+Number(s.amount),0);
  const live=d.filter(s=>!s.ended_at).length;
  const wait=d.filter(s=>s.ended_at&&s.paid===false).reduce((a,s)=>a+Number(s.amount),0);
  let run=0;
  const steps=d.map((s,i)=>{
    run+=Number(s.amount);
    const st=!s.ended_at?`▶ Playing now · bill so far ${money(s.amount)}`:s.status==='cancelled'?`✕ Cancelled · charged ${money(s.amount)}`:s.paid===false?`⏳ On hold, not paid yet · ${money(s.amount)}`:`✓ Saved · ${money(s.amount)}`;
    return `<li><b>Step ${i+1}</b> · ${hm(stT(s))}${s.bill_id&&d.findIndex(x=>x.id===s.bill_id)>=0?' · same customer bill as Step '+(d.findIndex(x=>x.id===s.bill_id)+1):''}<br>${s.station}${isCon(s.type)?' · '+s.type:''} · ${MODES[s.mode]||''} · ${esc(s.name)}<br>${durLabel(s.minutes)} · ${s.pay_mode} · <b>${st}</b><br><span class="muted">Total so far: ${money(run)}</span></li>`;
  }).join('');
  return `<div class="card" style="margin-bottom:12px"><h3>Today's earnings</h3>
    <div class="time" style="color:var(--neon)">${money(sum())}</div>
    <div class="muted">Cash ${money(sum('Cash'))} · UPI ${money(sum('UPI'))}<br>${d.length} session${d.length===1?'':'s'} today · ${live} playing now${wait?'<br>⏳ Waiting to be collected: '+money(wait):''}</div>
    <div class="muted" style="margin-top:6px">✓ Read from the database${checkedAt?' at '+hm(checkedAt):''}</div>
    <button class="b alt" onclick="openToday()">Refresh from database</button></div>
  <div class="card"><h3>Step by step</h3>${steps?'<ol class="steps">'+steps+'</ol>':'<div class="muted">No game saved yet today. Start a session on the Screens tab and it will appear here.</div>'}
  <div class="note">Every step above is read from the database. If a game you ran is missing here, it was not saved. Start it again.</div></div>`;
}
function renderStaff(){
  if(spage==='today'){$('staff').innerHTML=shopTabs()+todayHtml();return}
  renderPlay();
}
function renderPlay(){
  $('staff').innerHTML=shopTabs()+openBillsHtml()+'<div class="grid">'+stations.map(st=>{
    const a=active(st.id);
    if(!a)return `<div class="card free"><h3>${st.id}<span class="tag">Free</span></h3>
      <input id="n_${st.id}" placeholder="Customer name">
      ${billSelect(st.id)}
      ${isPS(st.type)?`<select id="c_${st.id}"><option>PS4</option><option>PS5</option></select>`:''}
      ${isPS(st.type)?`<select id="p_${st.id}" onchange="calc('${st.id}')"><option value="single">1 player</option><option value="multi2">2 players</option><option value="multi3">3 players</option><option value="multi4">4 players</option></select>`:''}
      <select id="d_${st.id}" onchange="calc('${st.id}')"><option value="30">30 min</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option></select>
      <select id="y_${st.id}"><option value="Cash">Pay by Cash</option><option value="UPI">Pay by UPI</option></select>

}
function drawBook(){
  const days=[0,1,2].map(istDay);
  if(!days.includes(B.date)){B.date=days[0];B.slot=null}
  const past=h=>B.date===days[0]&&h<istHour();
  const cap=grp(B.type)==='PS'?6:1;
  const slots=[];for(let h=10;h<=23;h++)slots.push(h);
  const taken=h=>((TK.find(r=>r.grp===grp(B.type)&&r.slot===h)||{}).n||0)>=cap;
  const m=modeOf(B.type,B.pl);
  $('book').innerHTML=`<div class="card"><h2 style="font-size:20px;margin-bottom:8px">Book your game</h2>
    <label class="muted">Choose your game</label>
    <div class="slots gm">${['PS5','PS4','Car Simulator','Meta Quest VR'].map(t=>`<button class="slot ${t===B.type?'sel':''}" onclick="B.type='${t}';B.slot=null;drawBook()">${t.toUpperCase()}</button>`).join('')}</div>
    ${isCon(B.type)?`<label class="muted">Players</label><div class="slots">${['single','multi2','multi3','multi4'].map((k,i)=>`<button class="slot ${B.pl===k?'sel':''}" onclick="B.pl='${k}';drawBook()">${i+1} PLAYER${i?'S':''}</button>`).join('')}</div>`:''}
    <div class="muted">Price: ${money(P[m][30])} for 30 min · ${money(P[m][60])} for 1 hour</div>
    <label class="muted">Date (you can book up to 2 days ahead)</label>
    <div class="slots">${days.map((d,i)=>`<button class="slot ${B.date===d?'sel':''}" onclick="B.date='${d}';B.slot=null;renderBook()">${['Today','Tomorrow','Day after'][i]}<br>${new Date(d+'T00:00:00Z').toLocaleDateString('en-IN',{day:'numeric',month:'short',timeZone:'UTC'})}</button>`).join('')}</div>
    <label class="muted">Pick a one-hour slot</label>
    <div class="slots">${slots.map(h=>`<button class="slot ${B.slot===h?'sel':''}" ${taken(h)||past(h)?'disabled':''} onclick="B.slot=${h};drawBook()">${h>12?h-12:h}${h>=12?' PM':' AM'}</button>`).join('')}</div>
    <input id="bn" maxlength="60" placeholder="Your name"><input id="bp" maxlength="20" type="tel" placeholder="Phone number">
    <label class="chk"><input type="checkbox" id="bc">I agree to the <a onclick="showLegal('terms')">Terms</a> and <a onclick="showLegal('privacy')">Privacy Policy</a>. I am 18 or older, or I am booking with my parent or guardian.</label><button class="b" onclick="confirmB()">Confirm booking</button><div id="bm" class="muted" style="margin-top:8px"></div></div>
    <div class="card" style="margin-top:12px"><h3 style="font-size:15px">Check my booking status</h3><input id="sp" type="tel" maxlength="20" placeholder="Your phone number"><button class="b alt" onclick="checkStatus()">Check status</button><div id="sm" class="muted" style="margin-top:8px"></div></div>`;
}
async function checkStatus(){
  const p=$('sp').value;
  if(p.replace(/\D/g,'').length<10){$('sm').textContent='Enter your 10 digit phone number.';return}
  const {data,error}=await sb.rpc('my_bookings',{p});
  if(error||!data||!data.length){$('sm').textContent='No upcoming booking found for this number.';return}
  const L={pending:'⏳ Waiting for confirmation',confirmed:'✅ Confirmed',cancelled:'❌ Not available, please book another slot'};
  $('sm').innerHTML=data.map(b=>{const sl=(b.slot>12?b.slot-12:b.slot)+(b.slot>=12?' PM':' AM');return `<div style="margin-top:6px"><b>${b.date} · ${sl}</b> · ${esc(b.type)}<br>${L[b.status]||b.status}</div>`}).join('');
}
async function confirmB(){
  const name=$('bn').value.trim(),phone=$('bp').value.trim();
  if(B.slot===null||!name||!phone){$('bm').textContent='Pick a slot and enter your name and phone number.';return}
  if(![0,1,2].map(istDay).includes(B.date)||(B.date===istDay(0)&&B.slot<istHour())){$('bm').textContent='This slot is not available. Please pick another date or time.';B.slot=null;drawBook();return}
  if(!$('bc').checked){$('bm').textContent='Please agree to the Terms and Privacy Policy.';return}
  const row={date:B.date,slot:B.slot,type:B.type,players:B.pl,name,phone};
  let {error}=await sb.from('bookings').insert({...row,consent_at:new Date().toISOString()});
  if(error&&/consent_at/.test(error.message))({error}=await sb.from('bookings').insert(row));
  if(error){$('bm').textContent='Could not book. Please try again or call us.';return}
  const m=modeOf(B.type,B.pl);
  const slot=(B.slot>12?B.slot-12:B.slot)+(B.slot>=12?' PM':' AM');
  const msg=`Hello Pixel Paradise, I want to book:\nName: ${name}\nPhone: ${phone}\nGame: ${B.type}${isCon(B.type)?' ('+MODES[B.pl]+')':''}\nDate: ${B.date}\nTime: ${slot}\nPrice: ${money(P[m][60])} per hour\nPlease confirm.`;
  const url='https://wa.me/'+WA+'?text='+encodeURIComponent(msg);
  $('bm').innerHTML=`Booking received! Tap below to send it on WhatsApp. The owner will confirm it on WhatsApp, and you can check your status below.<a class="b wa" href="${url}" target="_blank" rel="noopener">Send on WhatsApp</a>`;
  try{window.open(url,'_blank')}catch(e){}
}

function showLegal(k){const x=LEGAL[k];$('lgBody').innerHTML='<h3>'+x.t+'</h3>'+x.h();$('legal').classList.remove('hide');$('legal').firstChild.scrollTop=0}
function closeLegal(){$('legal').classList.add('hide')}

/* ---------- login and navigation ---------- */
let taps=0,tapT=0;
function logoTap(){const n=Date.now();taps=(n-tapT<2500)?taps+1:1;tapT=n;if(taps>=5){taps=0;if(!role)show('login')}}
function renderNav(v){
  $('nav').innerHTML=role?[['shop','Shop panel'],['owner','Owner panel']].map(x=>`<button class="${x[0]===v?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')+'<button onclick="logout()">Logout</button>':'';
}
function show(v){
  if(!role&&['home','shop','owner','ownerlogin'].includes(v))v='login';
  if(role&&v==='login')v='home';
  if(v==='owner'&&role!=='owner')v='ownerlogin';
  if(v==='ownerlogin'&&role==='owner')v='owner';
  view=v;
  const sec={login:'login',home:'login',ownerlogin:'login',shop:'staff',owner:'owner',book:'book'}[v];
  ['staff','owner','book','login'].forEach(x=>$(x).classList.toggle('hide',x!==sec));
  $('ann').classList.toggle('hide',v!=='book');if(v==='book')renderAnn();
  if(v==='login')renderLogin();
  if(v==='home')renderHome();
  if(v==='ownerlogin')renderOwnerLogin();
  if(v==='shop')renderStaff();
  if(v==='owner')renderOwner();
  if(v==='book')renderBook();
  renderNav(v);
  $('shopbtn').classList.toggle('hide',!!role||v!=='book');
}
async function go(v){
  if(v==='shop')spage='play';
  if(role==='owner'&&v!=='owner'){await leaveOwner();if(!role)return}
  show(v);
}
const PASSIN=`<input id="lp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit passcode" autocomplete="off" oninput="this.value=this.value.replace(/\\D/g,'')"`;
function renderLogin(){
  $('login').innerHTML=`<div class="card"><h2 style="font-size:20px;margin-bottom:8px">Shop login</h2>
  <select id="le"><option value="">Select shop</option><option value="pixelparadise">Pixel Paradise</option></select>
  ${PASSIN} onkeydown="if(event.key==='Enter')doLogin()">
  <button class="b" onclick="doLogin()">Login</button><div id="lm" class="muted" style="margin-top:8px"></div>
  <button class="b ghost2" onclick="show('book')">Back to booking</button></div>`;
}
function renderHome(){
  $('login').innerHTML=`<div class="card"><h2 style="font-size:20px;margin-bottom:12px">Welcome to Pixel Paradise</h2>
  <button class="b big" onclick="go('shop')">Shop panel</button>
  <button class="b big alt" onclick="go('owner')">Owner panel</button></div>`;
}
function renderOwnerLogin(){
  $('login').innerHTML=`<div class="card"><h2 style="font-size:20px;margin-bottom:8px">Owner login</h2>
  <select id="le"><option value="">Select owner</option>${OWNERS.map(o=>`<option value="${o[0]}">${o[1]} (Owner)</option>`).join('')}</select>
  ${PASSIN} onkeydown="if(event.key==='Enter')doOwnerLogin()">
  <button class="b" onclick="doOwnerLogin()">Open Owner panel</button><div id="lm" class="muted" style="margin-top:8px"></div>
  <button class="b ghost2" onclick="go('home')">Back</button></div>`;
}
async function setRole(){
  const {data}=await sb.rpc('my_role');role=data||null;
  if(!role)await sb.auth.signOut();
  return role;
}
async function doLogin(){
  const id=$('le').value.toLowerCase().replace(/[^a-z0-9]/g,''),code=$('lp').value;
  if(!id||code.length!==6){$('lm').textContent='Select the shop and enter the 6 digit passcode.';return}
  const cred={email:id+LOGIN_DOMAIN,password:code};
  const {error}=await sb.auth.signInWithPassword(cred);
  if(error){$('lm').textContent=errMsg(error);return}
  await setRole();
  if(role!=='shop'){if(role)await sb.auth.signOut();role=null;$('lm').textContent='Wrong ID or passcode.';return}
  shopCred=cred;
  await loadPrices();await loadSessions();listen();show('home');
}
async function doOwnerLogin(){
  const name=$('le').value,code=$('lp').value;
  if(!name||code.length!==6){$('lm').textContent='Select the owner and enter the 6 digit passcode.';return}
  const {error}=await sb.auth.signInWithPassword({email:name+LOGIN_DOMAIN,password:code});
  if(error){$('lm').textContent=errMsg(error);return}
  await setRole();
  if(role!=='owner'){await leaveOwner();if(role)$('lm').textContent='This login is not an owner.';return}
  ownerCred={email:name+LOGIN_DOMAIN,password:code};
  await loadSessions();listen();show('owner');
}
async function leaveOwner(){
  ownerCred=null;
  if(shopCred){const {error}=await sb.auth.signInWithPassword(shopCred);if(!error&&await setRole()){await loadSessions();listen();return}}
  await logout();
}
async function listen(){await sb.removeAllChannels();sb.channel('sess').on('postgres_changes',{event:'*',schema:'public',table:'sessions'},()=>refresh()).subscribe()}
async function logout(){await sb.removeAllChannels();await sb.auth.signOut();role=null;shopCred=null;ownerCred=null;sessions=[];show('book')}
window.addEventListener('hashchange',()=>{if(location.hash==='#shop'&&!role)show('login')});
(async function init(){
  if(String(SUPABASE_URL).startsWith('PASTE')||String(SUPABASE_KEY).startsWith('PASTE'))$('cfg').classList.remove('hide');
  try{
    await loadPrices();await loadAnn();
    const {data}=await sb.auth.getSession();
    if(data.session){
      await setRole();
      if(role==='owner'){await sb.auth.signOut();role=null}
      if(role==='shop'){await loadSessions();listen();show('home');return}
    }
  }catch(e){}
  show(location.hash==='#shop'?'login':'book');
})();
</script>
</body>
